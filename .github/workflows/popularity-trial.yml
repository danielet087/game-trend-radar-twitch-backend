name: IGDB PopScore trial
run-name: "IGDB PopScore trial | ${{ inputs.igdb_ref || 'feat/popscore-trial' }} | ${{ github.event_name }}"

# Read-only: measures IGDB popularity primitives for NS/NS2 games and uploads a
# report. It reuses the IGDB (Twitch) credentials and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      igdb_ref:
        description: IGDB backend ref with scripts/popularity_trial.py
        default: feat/popscore-trial
  pull_request:
    paths: ['.github/workflows/popularity-trial.yml']

permissions:
  contents: read

concurrency:
  group: igdb-popscore-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nintendo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: danielet087/game-trend-radar-igdb-backend
          ref: ${{ inputs.igdb_ref || 'feat/popscore-trial' }}
          path: nintendo
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the IGDB client dependency
        run: python -m pip install --disable-pip-version-check 'requests>=2.32.3,<3'
      - name: Run the read-only PopScore trial
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python -m scripts.popularity_trial --output-dir output
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('nintendo/output/popularity_trial.*') != ''
        with:
          name: igdb-popscore-trial
          path: nintendo/output/popularity_trial.*
          retention-days: 7
