name: Test standalone collector
on:
  push:
    branches: [main]
    paths: ['radar_backend/**', 'collectors/**', 'scripts/**', 'tests/**', 'scheduler/**', 'data/twitch_*.json', 'requirements*.txt', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n scripts/git_frontend_auth.sh scripts/publish_frontend.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scheduler/cloudflare/test/*.test.mjs
      - name: Install Cloudflare runtime test tools
        run: npm ci --prefix scheduler/cloudflare/test/runtime --no-audit --no-fund
      - name: Test outbound requests in the Cloudflare runtime
        run: npm test --prefix scheduler/cloudflare/test/runtime
