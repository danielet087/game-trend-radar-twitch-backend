name: Test standalone collector
on:
  push:
    branches: [main]
    paths: ['collectors/**', 'scripts/**', 'tests/**', 'data/twitch_*.json', 'requirements*.txt', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n scripts/git_frontend_auth.sh scripts/publish_frontend.sh
