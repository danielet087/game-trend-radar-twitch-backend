name: Collect Twitch live data

# First validate the new threshold collector manually before enabling its hourly schedule.
# CI tests run separately and do not call the live API.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twitch-live-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check collection credentials
        id: credentials
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ -n "$TWITCH_CLIENT_ID" ] && [ -n "$TWITCH_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo '::notice::Missing Twitch credentials; collection skipped.'
            echo '### Twitch: 尚未設定 Secrets，本次未收集、未發布。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run offline tests
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pytest -q
      - name: Collect Twitch
        if: steps.credentials.outputs.configured == 'true'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python -m scripts.update_twitch --min-viewers 7000 --output output/twitch_live.json
      - name: Validate JSON
        if: steps.credentials.outputs.configured == 'true'
        run: python -m json.tool output/twitch_live.json > /dev/null
      - name: Preserve collected JSON
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twitch-live-json
          path: output/twitch_live.json
          if-no-files-found: error
          retention-days: 2
      - name: Publish to frontend
        if: steps.credentials.outputs.configured == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo '::notice::FRONTEND_REPO_TOKEN is not configured; JSON is available in the artifact only.'
            echo '### Twitch: 已收集，未發布；請設定 FRONTEND_REPO_TOKEN。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/publish_frontend.sh output/twitch_live.json
          echo '### Twitch: 已發布最新候選與每小時歷史紀錄。' >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: |
          echo '### Twitch: 本次失敗，請檢查失敗步驟；未發布的結果不會冒充更新完成。' >> "$GITHUB_STEP_SUMMARY"
