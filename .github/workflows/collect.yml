name: Collect Twitch live data
run-name: "Collect Twitch | slot=${{ inputs.target_slot || 'automatic' }} | ${{ inputs.trigger_source || github.event_name }}"

# Cloudflare dispatches at minute 05 of every hour; there is no native cron.
# Delayed starts keep actual measurement times.
# CI tests run separately and do not call the live API.
on:
  # Bootstrap a mapping-module deployment once using the regular collection
  # pipeline; data-only commits never trigger this path.
  push:
    branches: [main]
    paths:
      - 'collectors/steam_twitch_mapping.py'
      - 'collectors/twitch_steam_discovery.py'
  workflow_dispatch:
    inputs:
      target_slot:
        description: 'UTC hourly slot (Cloudflare supplies this; leave empty for current hour)'
        required: false
        type: string
      trigger_source:
        description: 'Collection trigger source'
        required: false
        type: choice
        options: [manual, cloudflare]
        default: manual
      force:
        description: 'Manually collect again even if this hour is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: twitch-live-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check collection credentials
        id: credentials
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -n "$TWITCH_CLIENT_ID" ] && [ -n "$TWITCH_CLIENT_SECRET" ] && [ -n "$FRONTEND_REPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo '::error::Missing collection or publication credentials.'
            echo '### Twitch: 缺少收集或發布 Secrets，本次未收集、未發布。' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run offline tests
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pytest -q
      # Workflow concurrency is already held here. Recheck the newest published
      # receipt after queued work, not just at external dispatch time.
      - name: Recheck hourly publication
        id: guard
        if: steps.credentials.outputs.configured == 'true'
        env:
          TARGET_SLOT: ${{ inputs.target_slot }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          FORCE_COLLECTION: ${{ inputs.force || github.event_name == 'push' || false }}
        run: python -m scripts.collection_guard
      - name: Load consistent observation list and Steam mapping/intake inputs
        if: steps.guard.outputs.should_collect == 'true'
        run: python -m scripts.load_twitch_tracking --output output/twitch_tracking_input.json --steam-output output/steam_catalog_input.json --mapping-output output/twitch_steam_mapping_input.json --discovery-output output/twitch_steam_discovery_input.json
      - name: Restore daily follower counts
        if: steps.guard.outputs.should_collect == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/twitch_followers.json
          key: twitch-followers-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            twitch-followers-v1-
      - name: Collect Twitch
        if: steps.guard.outputs.should_collect == 'true'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TARGET_SLOT: ${{ steps.guard.outputs.target_slot }}
          TRIGGER_SOURCE: ${{ steps.guard.outputs.trigger_source }}
        # One 25-minute collection deadline, leaving time inside the 30-minute
        # job for setup, cache save and publication. No separate follower cap.
        run: python -m scripts.update_twitch --min-viewers 7000 --max-collection-seconds 1500 --target-slot "$TARGET_SLOT" --trigger-source "$TRIGGER_SOURCE" --tracking-state output/twitch_tracking_input.json --steam-catalog output/steam_catalog_input.json --steam-mapping output/twitch_steam_mapping_input.json --steam-discovery output/twitch_steam_discovery_input.json --output output/twitch_live.json
      - name: Save follower lookup progress
        if: always() && steps.guard.outputs.should_collect == 'true' && hashFiles('.cache/twitch_followers.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/twitch_followers.json
          key: twitch-followers-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate JSON
        if: steps.guard.outputs.should_collect == 'true'
        run: python -m json.tool output/twitch_live.json > /dev/null
      - name: Preserve collected JSON
        if: steps.guard.outputs.should_collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twitch-live-json
          path: output/twitch_live.json
          if-no-files-found: error
          # Short-lived recovery artifact only. Published daily history is not pruned.
          retention-days: 2
      - name: Publish to frontend
        if: steps.guard.outputs.should_collect == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          bash scripts/publish_frontend.sh output/twitch_live.json
          echo '### Twitch: 已發布最新候選與每小時歷史紀錄。' >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: |
          echo '### Twitch: 本次失敗，請檢查失敗步驟；未發布的結果不會冒充更新完成。' >> "$GITHUB_STEP_SUMMARY"
