name: Collect Nintendo catalog
run-name: "Nintendo catalog | slot=${{ inputs.target_slot || 'manual' }} | ${{ inputs.trigger_source || github.event_name }}"

# The Nintendo backend owns collection and validation. This credential host
# reuses existing IGDB/publication secrets; Cloudflare supplies the daily slot.
# Large candidate ledgers use compact JSON; public cards remain a small catalog.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-nintendo.yml']
  workflow_dispatch:
    inputs:
      target_slot:
        description: 'UTC daily slot; leave blank for a manual collection'
        required: false
        type: string
      trigger_source:
        description: 'Collection trigger source'
        required: false
        type: choice
        options: [manual, cloudflare]
        default: manual
      force:
        description: 'Manually collect again even if the daily slot was published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nintendo-catalog-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nintendo
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danielet087/game-trend-radar-nintendo-backend
          ref: main
          path: nintendo
          persist-credentials: false
      - name: Check collection credentials
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ] || [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo '::error::Missing Nintendo collection or publication credentials.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nintendo/requirements*.txt
      - name: Install dependencies and validate offline
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q
      - name: Recheck daily publication while holding concurrency
        id: guard
        env:
          TARGET_SLOT: ${{ inputs.target_slot }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          FORCE_COLLECTION: ${{ inputs.force || github.event_name == 'push' || false }}
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          args=(--target-slot "$TARGET_SLOT" --trigger-source "$TRIGGER_SOURCE")
          if [ "$FORCE_COLLECTION" = 'true' ]; then args+=(--force); fi
          python -m scripts.guard "${args[@]}"
      - name: Load persistent Nintendo candidates
        if: steps.guard.outputs.should_collect == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import requests
          from scripts.publish import GitHub, FRONTEND, PublishError
          client = GitHub(os.environ['FRONTEND_REPO_TOKEN'])
          head, _ = client.head(FRONTEND)
          try:
              metadata = client.request('GET', f'/repos/{FRONTEND}/contents/data/nintendo_master.json?ref={head}')
          except PublishError as error:
              if error.status != 404:
                  raise SystemExit('Cannot inspect previous Nintendo state; the existing state was preserved.')
              print('Verified that this commit has no Nintendo master; starting the first collection.')
          else:
              response = requests.get(f'https://raw.githubusercontent.com/{FRONTEND}/{head}/data/nintendo_master.json', timeout=30, allow_redirects=False)
              if response.status_code != 200:
                  raise SystemExit(f'Cannot read previous Nintendo state: HTTP {response.status_code}')
              raw = response.content
              blob_sha = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              if blob_sha != metadata.get('sha'):
                  raise SystemExit('Previous Nintendo master does not match the pinned Git commit.')
              document = json.loads(raw.decode('utf-8'))
              if not isinstance(document, dict):
                  raise SystemExit('Invalid Nintendo candidate document; previous state was not discarded.')
              Path('input').mkdir(exist_ok=True)
              Path('input/nintendo_master.json').write_bytes(raw)
          PY
      - name: Collect and qualify the next 365 days
        if: steps.guard.outputs.should_collect == 'true'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          args=(--output-dir output)
          if [ -f input/nintendo_master.json ]; then args+=(--existing input/nintendo_master.json); fi
          python -m nintendo_backend.collect "${args[@]}"
      - name: Verify available Nintendo exclusivity evidence
        if: steps.guard.outputs.should_collect == 'true'
        run: python -m nintendo_backend.exclusivity --output-dir output
      - name: Publish Nintendo data and receipt
        if: steps.guard.outputs.should_collect == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          TARGET_SLOT: ${{ steps.guard.outputs.target_slot }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
        run: python -m scripts.publish --output-dir output --target-slot "$TARGET_SLOT" --trigger-source "$TRIGGER_SOURCE"
      - name: Preserve the collected public data
        if: always() && steps.guard.outputs.should_collect == 'true' && hashFiles('nintendo/output/nintendo_upcoming.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nintendo-catalog
          path: nintendo/output/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Summarize Nintendo collection
        if: always() && hashFiles('nintendo/output/nintendo_upcoming.json') != ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path('output/nintendo_upcoming.json').read_text(encoding='utf-8'))
          games = catalog['games']
          result = {'status': 'collected', 'generated_at': catalog['generated_at'], 'public_count': len(games), 'games': [{'id': game['id'], 'name': game.get('display_name', game.get('name_en')), 'hypes': game['hypes'], 'platforms': game['platforms'], 'releases': game['releases'], 'exclusivity': game['exclusivity']} for game in games]}
          print('NINTENDO_RESULT ' + json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### Nintendo：已收集 {len(games)} 款符合月曆條件的遊戲\n\n")
              summary.write('採 hypes ≥ 30、未來 365 天、平台別確切日期及內容資格驗證。發布結果請對照 Publish 步驟與前端回條。\n')
          PY
