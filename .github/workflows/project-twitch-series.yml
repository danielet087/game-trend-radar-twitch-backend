name: Project Twitch game history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['radar_backend/state/twitch_series.py', '.github/workflows/project-twitch-series.yml']
permissions:
  contents: read
concurrency:
  group: twitch-live-publish
  cancel-in-progress: false
jobs:
  project:
    if: vars.RADAR_DATABASE_MIGRATION_PAUSE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m radar_backend.jobs.project_twitch_series
        env:
          RADAR_DATABASE_PRIMARY: ${{ vars.RADAR_DATABASE_PRIMARY || '0' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
