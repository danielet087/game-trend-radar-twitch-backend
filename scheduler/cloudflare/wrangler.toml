# Must match the existing Worker connected to this repository in Cloudflare Builds.
name = "game-trend-radar-twitch-backend"
main = "src/entry.mjs"
compatibility_date = "2026-09-29"
workers_dev = false
preview_urls = false

[triggers]
crons = ["0,5,15,17,30 * * * *"]

# Stage the daily Workflow binding before changing the active Cron triggers.
# Its independent schedule is enabled only after Cloudflare accepts this binding.
[[workflows]]
name = "game-trend-radar-steam-daily-scheduler"
binding = "STEAM_DAILY_SCHEDULE"
class_name = "SteamDailyScheduler"

[vars]
GITHUB_OWNER = "danielet087"
GITHUB_REPO = "game-trend-radar-twitch-backend"
GITHUB_WORKFLOW_ID = "369223512"
GITHUB_BRANCH = "main"
FRONTEND_REPO = "game-trend-radar"
# All workflows accept the controller slot; the runtime token permits all four repositories.
RADAR_ENABLED_JOBS = "steam_daily,steam_catchup,steam_growth,steam_content,frontend_insights"

# GITHUB_ACTIONS_TOKEN is a Cloudflare Secret, never a variable in this file.
[observability]
enabled = true
head_sampling_rate = 1
